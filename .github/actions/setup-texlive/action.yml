name: Set up TeX Live
description: >-
  Installs the packages in texlive-packages.txt from the given TeX Live
  release, cached between runs

inputs:
  texlive_version:
    description: TeX Live release year (e.g. 2017), or latest
    required: true

runs:
  using: composite
  steps:
    - name: Select TeX Live release
      id: texlive
      shell: bash
      env:
        VERSION: ${{ inputs.texlive_version }}
      run: |
        if [ "$VERSION" = latest ]; then
          echo "TEXLIVE=TeX Live (latest)" >> "$GITHUB_ENV"
          exit 0
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "TEXLIVE=TeX Live $VERSION" >> "$GITHUB_ENV"
        # A past release installs from its final, frozen state (plain HTTP, as
        # older installers cannot download over HTTPS). The current release
        # has no such archive yet, so install-texlive picks a mirror for it.
        historic=http://ftp.math.utah.edu/pub/tex/historic/systems/texlive
        repository="$historic/$VERSION/tlnet-final"
        if curl -sfIL "$repository/install-tl-unx.tar.gz" > /dev/null; then
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
        fi
    - name: Install TeX Live
      uses: zauguin/install-texlive@v4
      with:
        package_file: texlive-packages.txt
        texlive_version: ${{ steps.texlive.outputs.version }}
        repository: ${{ steps.texlive.outputs.repository }}
    - name: Set up fonts
      shell: bash
      run: .github/scripts/setup-fonts.sh
