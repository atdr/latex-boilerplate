name: Build LaTeX document

on:
  push:
  workflow_dispatch:
    inputs:
      texlive_version:
        description: TeX Live version (e.g. 2017), overriding TEXLIVE_VERSION below
        required: false

env:
  # Root .tex file to compile (Overleaf projects often use a name other than main.tex)
  ROOT_FILE: main.tex
  # latexmk engine flag: -pdf (pdfLaTeX, Overleaf's default), -xelatex or -lualatex
  ENGINE: -xelatex
  # TeX Live release year (2013 onwards), or latest
  TEXLIVE_VERSION: latest

jobs:
  build_latex:

    runs-on: ubuntu-latest

    # Needed to create tags and releases
    permissions:
      contents: write

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7
      - name: Compile LaTeX document
        env:
          VERSION: ${{ inputs.texlive_version || env.TEXLIVE_VERSION }}
        run: |
          if [ "$VERSION" = latest ]; then image=texlive/texlive:latest; else image="texlive/texlive:TL${VERSION}-historic"; fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker run --rm -v "$PWD:/workdir" -w /workdir "$image" \
            latexmk "$ENGINE" -file-line-error -interaction=nonstopmode "$ROOT_FILE"
      - name: Publish PDF as release
        # Releases are not subject to the Actions artifact retention period
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          pdf="${ROOT_FILE%.tex}.pdf"
          tag="build-${SHA::7}"
          notes="Compiled from ${GITHUB_REF_NAME} at ${SHA} using ${IMAGE}."
          if gh release view "$tag" > /dev/null 2>&1; then
            # Rebuild of the same commit (e.g. with another TeX Live version)
            gh release upload "$tag" "$pdf" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$pdf" \
              --target "$SHA" \
              --title "Build ${SHA::7} ($(git log -1 --format=%cs "$SHA"))" \
              --notes "$notes"
          fi
      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: run-log
          path: "*.log"
